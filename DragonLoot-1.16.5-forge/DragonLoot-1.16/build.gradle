buildscript {
	repositories {
		maven { url = 'https://maven.minecraftforge.net' }
		maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
		mavenCentral()
	}
	dependencies {
		classpath 'net.minecraftforge.gradle:ForgeGradle:4.1.16'
		classpath 'org.spongepowered:mixingradle:0.7.38'
	}
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'maven-publish'
apply plugin: 'org.spongepowered.mixin'

version = project.mod_version
group = project.maven_group
archivesBaseName = project.archives_base_name

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
	withSourcesJar()
}

// Development-only dedicated-server assertions. These outputs are never added to jar/sourcesJar.
sourceSets {
	smokeTest {
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
	}
}

def smokeCaseName = (project.findProperty('smokeCase') ?: 'baseline').toString()
if (!(smokeCaseName ==~ /[A-Za-z0-9_-]+/)) {
	throw new GradleException('smokeCase must contain only letters, digits, underscores or hyphens')
}

minecraft {
	mappings channel: project.mapping_channel, version: project.mapping_version

	runs {
		client {
			workingDirectory project.file('run/client')
			property 'forge.logging.console.level', 'debug'
			property 'mixin.env.disableRefMap', 'true'
			mods {
				dragonloot {
					source sourceSets.main
				}
			}
		}
		server {
			workingDirectory project.file('run/server')
			property 'forge.logging.console.level', 'debug'
			property 'mixin.env.disableRefMap', 'true'
			mods {
				dragonloot {
					source sourceSets.main
				}
			}
		}
		smokeTest {
			parent minecraft.runs.server
			workingDirectory project.file("run/smokeTest/${smokeCaseName}")
			jvmArgs '-Xmx2G', '-XX:ActiveProcessorCount=2'
			args 'nogui'
			property 'forge.logging.console.level', 'info'
			property 'mixin.env.disableRefMap', 'true'
			property 'dragonloot.smoke.case', smokeCaseName
			mods {
				dragonloot {
					source sourceSets.main
				}
				dragonloot_smoketest {
					source sourceSets.smokeTest
				}
			}
		}
		data {
			workingDirectory project.file('run/data')
			property 'forge.logging.console.level', 'debug'
			args '--mod', 'dragonloot', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
			mods {
				dragonloot {
					source sourceSets.main
				}
			}
		}
	}
}

sourceSets {
	main {
		resources {
			srcDir 'src/generated/resources'
		}
	}
}

repositories {
	mavenCentral()
	maven { url = 'https://maven.minecraftforge.net' }
	maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
	minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
	annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
	def forgeFullJar = file("${gradle.gradleUserHomeDir}/caches/forge_gradle/minecraft_user_repo/net/minecraftforge/forge/${project.minecraft_version}-${project.forge_version}_mapped_${project.mapping_channel}_${project.mapping_version}/forge-${project.minecraft_version}-${project.forge_version}_mapped_${project.mapping_channel}_${project.mapping_version}.jar")
	compileOnly files(forgeFullJar)
}

mixin {
	add sourceSets.main, "dragonloot.refmap.json"
	config "dragonloot.mixins.json"
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

// Also expose the same Forge-generated launch setup for a standalone JVM. This
// makes runtime exit status independent of Gradle's attached Windows console.
tasks.register('writeSmokeTestLaunch') {
	dependsOn 'prepareRunSmokeTest', 'smokeTestClasses'
	doLast {
		def runTask = tasks.named('runSmokeTest').get()
		def launch = [
			main: runTask.main,
			args: runTask.args,
			jvmArgs: runTask.allJvmArgs,
			classpath: runTask.classpath.asPath,
			workingDirectory: runTask.workingDir.absolutePath,
			environment: runTask.environment.findAll { key, value ->
				['MOD_CLASSES', 'target', 'MCP_VERSION', 'MC_VERSION', 'FORGE_GROUP', 'FORGE_VERSION',
				 'nativesDirectory', 'assetDirectory', 'assetIndex'].contains(key)
			}
		]
		file('build/smoke-test-launch.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(launch))
	}
}

processResources {
	inputs.property 'version', project.version
	filesMatching('META-INF/mods.toml') {
		expand 'version': project.version
	}
}

jar {
	manifest {
		attributes([
			"Specification-Title": project.archives_base_name,
			"Specification-Vendor": project.maven_group,
			"Specification-Version": '1',
			"Implementation-Title": project.name,
			"Implementation-Version": project.version,
			"Implementation-Vendor": project.maven_group
		])
	}
	from('LICENSE') {
		rename { "${it}_${archivesBaseName}" }
	}
}

jar.finalizedBy('reobfJar')

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifact jar
		}
	}
}
