plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = project.maven_group
version = "${project.mod_version}-neoforge-${project.minecraft_version}"
base { archivesName = project.archives_base_name }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}
repositories { mavenCentral() }

def recipeProfile = providers.gradleProperty('recipeProfile').getOrElse('vanilla')
def testDirectory = providers.gradleProperty('testDirectory').getOrElse('build/gameTest')

neoForge {
    version = project.neoforge_version
    addModdingDependenciesTo sourceSets.gameTest
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            gameDirectory = file(testDirectory)
            systemProperty 'neoforge.enabledGameTestNamespaces', 'dragonloot_game_tests'
            systemProperty 'dragonloot.test.recipeProfile', recipeProfile
            systemProperty 'dragonloot.test.compatProfile', providers.gradleProperty('compatProfile').getOrElse('none')
            systemProperty 'dragonloot.test.gearPerksExpected', providers.gradleProperty('gearPerksExpected').getOrElse('false')
            programArgument '--tests'
            programArgument 'dragonloot_game_tests:*'
            programArgument '--report'
            programArgument file("${testDirectory}/results.xml").absolutePath
            if (providers.gradleProperty('testPacks').isPresent()) {
                programArgument '--packs'
                programArgument file(providers.gradleProperty('testPacks').get()).absolutePath
            }
            jvmArgument '-Xmx2G'
        }
        runtimeServer {
            server()
            sourceSet = sourceSets.gameTest
            gameDirectory = layout.buildDirectory.dir('runtime/server').get().asFile
            programArgument '--nogui'
            jvmArgument '-Xmx2G'
        }
        runtimeClient {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory = layout.buildDirectory.dir('runtime/client').get().asFile
            programArgument '--width'
            programArgument '1280'
            programArgument '--height'
            programArgument '720'
            jvmArgument '-Xmx2G'
            systemProperty 'dragonloot.test.clientSmoke', providers.gradleProperty('clientSmoke').getOrElse('false')
            systemProperty 'dragonloot.test.clientServerAddress', providers.gradleProperty('clientServerAddress').getOrElse('')
        }
    }
    mods {
        dragonloot { sourceSet sourceSets.main }
        dragonloot_game_tests { sourceSet sourceSets.gameTest }
    }
    runs.named('client') { loadedMods = [mods.dragonloot] }
    runs.named('server') { loadedMods = [mods.dragonloot] }
}

processResources {
    inputs.property 'version', project.mod_version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'neoforge_version', project.neoforge_version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.mod_version,
               minecraft_version: project.minecraft_version,
               neoforge_version: project.neoforge_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '400']
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
jar { from('LICENSE') { rename { "LICENSE_${project.archives_base_name}" } } }
tasks.named('sourcesJar') { from('LICENSE') { rename { "LICENSE_${project.archives_base_name}" } } }
tasks.register('gameTestJar', Jar) {
    archiveBaseName = 'dragonloot-devfixtures'
    archiveClassifier = 'game-tests'
    from sourceSets.gameTest.output
}
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
            artifact sourcesJar
        }
    }
}
